<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상세페이지 블록 편집기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@800&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Pretendard";src:url("fonts/PretendardVariable.woff2") format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
/* 편집기 화면 규칙
   구조: 상단 바 · 왼쪽 아이콘 레일 + 블록 패널(2열 썸네일) · 가운데 작업 영역(선택만, 블록 옆 도구) · 오른쪽 내용 넣기
   글자 12 · 13 · 14 · 15,  간격 4 · 8 · 12 · 16 · 24,  모서리 6/8.  밝은 화면·어두운 화면 둘 다 지원 */
:root{
  --panel:#ffffff; --rail:#ffffff; --top:#ffffff; --stage:#e9ebef; --line:#e3e6ea; --ink:#191f28; --muted:#6b7684; --soft:#f1f3f5;
  --accent:#2f7bf6; --on-accent:#ffffff; --accent-soft:#eaf2fe; --focus:#2f7bf6; --warn:#c2570c; --danger:#e5484d;
  --ui:"Pretendard",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --panel:#1c1e21; --rail:#141517; --top:#0d0e10; --stage:#2a2c30; --line:#303338; --ink:#f1f3f5; --muted:#9aa1ab; --soft:#282b2f;
    --accent:#3d8bfd; --on-accent:#ffffff; --accent-soft:#1c2f4d; --focus:#6ea4fa; --warn:#f0a868; --danger:#ff6b6f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#1c1e21; --rail:#141517; --top:#0d0e10; --stage:#2a2c30; --line:#303338; --ink:#f1f3f5; --muted:#9aa1ab; --soft:#282b2f;
  --accent:#3d8bfd; --on-accent:#ffffff; --accent-soft:#1c2f4d; --focus:#6ea4fa; --warn:#f0a868; --danger:#ff6b6f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font:400 14px/1.45 var(--ui);letter-spacing:-.01em;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}

/* 상단 */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 12px 0 16px;background:var(--top);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo-mark{width:24px;height:24px;flex:none}
.top h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap}
.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:4px}
.actions{display:flex;align-items:center;gap:4px}
.sep{width:1px;height:20px;background:var(--line);margin:0 8px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;padding:0 16px;margin-left:4px}
.btn.primary:hover{background:var(--accent);filter:brightness(.94)}
.btn.small{height:28px;padding:0 8px;font-size:12px}
.btn.icon{width:36px;padding:0}
.btn.block{width:100%}
.btn svg{width:16px;height:16px;flex:none}
.btn:disabled{opacity:.35;cursor:default;background:none}

.panes{flex:none;display:none;border-bottom:1px solid var(--line);background:var(--panel);padding:8px 12px}
.seg{display:flex;height:36px;background:var(--soft);border-radius:6px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:4px;padding:0 8px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}

/* 본문 3단 */
.main{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr) 320px}
.left{display:grid;grid-template-columns:72px 304px;min-height:0;border-right:1px solid var(--line)}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:8px 6px;display:flex;flex-direction:column;gap:4px}
.rail button{display:grid;justify-items:center;gap:5px;border:0;background:none;border-radius:6px;padding:10px 0 8px;font-size:11px;font-weight:500;color:var(--muted);line-height:1.2}
.rail button svg{width:22px;height:22px}
.rail button:hover{background:var(--soft);color:var(--ink)}
.rail button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.panel{background:var(--panel);overflow-y:auto;scrollbar-gutter:stable;min-height:0;padding:16px 6px 16px 16px}
.insp{background:var(--panel);overflow-y:auto;min-height:0;border-left:1px solid var(--line)}
.stage{overflow:auto;min-height:0;padding:32px 0 96px}
.stage-in{position:relative;margin:0 auto;width:max-content;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.16)}

/* 선택한 블록 옆 도구 */
.tools{position:absolute;z-index:5;display:grid;gap:2px;padding:4px;background:var(--panel);border-radius:8px;box-shadow:0 0 0 1px var(--line),0 4px 16px rgba(0,0,0,.18)}
.tools button{width:32px;height:32px;border:0;background:none;border-radius:6px;color:var(--ink);display:grid;place-items:center}
.tools button:hover{background:var(--soft)}
.tools button:disabled{opacity:.3;cursor:default;background:none}
.tools button svg{width:16px;height:16px}
.tools hr{border:0;border-top:1px solid var(--line);margin:2px 4px;width:auto}
.tools .del:hover{color:var(--danger)}

/* 선택한 블록의 칸 번호 (오른쪽 패널의 이름과 같은 글자) */
.tags{position:absolute;inset:0;z-index:4;pointer-events:none}
.tags span.out{transform:translateX(-100%)}
.tags span{position:absolute;font-size:10px;font-weight:700;line-height:1;padding:3px 5px;border-radius:4px;background:var(--accent);color:#fff;white-space:nowrap;box-shadow:0 0 0 1px rgba(255,255,255,.75)}

/* 왼쪽 패널: 블록 고르기 */
.sec{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:24px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2{font-size:13px;font-weight:700;margin:0}
.sec-h span{font-size:12px;color:var(--muted)}
.grid{column-count:2;column-gap:10px}
.card{display:block;position:relative;break-inside:avoid;margin:0 0 10px;border-radius:6px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:0 0 0 1px var(--line)}
.card:hover,.card:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.card::after{content:"＋";position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:14px;font-weight:700;opacity:0}
.card:hover::after,.card:focus-visible::after{opacity:1}
.tw{display:block;max-height:250px;overflow:hidden}
.tw .page{pointer-events:none}

/* 왼쪽 패널: 내 페이지 */
.rows{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.row{border-radius:6px;background:var(--panel);box-shadow:0 0 0 1px var(--line);position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);align-items:stretch;min-height:48px}
.row.sel{box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.row.drag{opacity:.45}
.row.drop-before::before,.row.drop-after::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent)}
.row.drop-before::before{top:-4px}
.row.drop-after::after{bottom:-4px}
.handle{display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.handle:hover{color:var(--ink)}
.handle svg{width:14px;height:14px}
.row-main{display:grid;align-content:center;gap:1px;text-align:left;border:0;background:none;padding:7px 12px 7px 0;min-width:0}
.row-t,.row-s{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-t{font-size:13px;font-weight:700}
.row-s{font-size:12px;color:var(--muted)}
.empty-note{color:var(--muted);font-size:13px;padding:40px 16px;text-align:center;line-height:1.7}

/* 오른쪽: 내용 넣기 — 선 없이 여백으로 구분, 글자 12(라벨) · 14(입력) · 15(제목) */
.insp-h{position:sticky;top:0;z-index:2;background:var(--panel);padding:20px 16px 12px;display:flex;align-items:baseline;gap:8px}
.insp-h h2{margin:0;font-size:15px;font-weight:700;line-height:1.4}
.insp-h span{font-size:13px;color:var(--muted)}
.pad{padding:4px 16px 56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 8px}
.fld{grid-column:1/-1;display:grid;gap:6px;align-content:start;scroll-margin:72px;border-radius:6px}
.fld.half{grid-column:auto}
.fld>label,.lbl{justify-self:start;font-size:11px;font-weight:700;line-height:1;color:var(--accent);background:var(--accent-soft);padding:4px 6px;border-radius:4px}
.fld input[type=text],.fld textarea{display:block;width:100%;border:1px solid transparent;border-radius:6px;background:var(--soft);padding:9px 12px;font-size:14px;line-height:1.45;color:var(--ink)}
.fld input[type=text]:hover,.fld textarea:hover{border-color:var(--line)}
.fld input[type=text]:focus,.fld textarea:focus{outline:0;background:var(--panel);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld input::placeholder,.fld textarea::placeholder{color:var(--muted);opacity:.7}
.fld textarea{resize:none;min-height:62px;field-sizing:content}
.help{font-size:12px;color:var(--muted);line-height:1.4}
.help.over{color:var(--warn)}
.em{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:6px}
.em:focus-within{border-color:var(--accent)}
.em label{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.fld .em input[type=text]{flex:1;min-width:0;height:30px;border:0;background:none;padding:0;font-size:13px;box-shadow:none}
.imgwrap{position:relative}
.imgtile{display:grid;place-items:center;align-content:center;gap:6px;height:140px;border:1px solid transparent;border-radius:8px;background:var(--soft) center/cover no-repeat;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.imgtile svg{width:22px;height:22px}
.imgtile:hover{border-color:var(--accent);color:var(--accent)}
.imgtile.has{place-items:end;align-content:end;padding:8px}
.imgtile.has span{background:rgba(25,31,40,.72);color:#fff;border-radius:6px;padding:4px 8px;font-size:12px}
.imgx{position:absolute;right:8px;top:8px;width:26px;height:26px;border:0;border-radius:6px;background:rgba(25,31,40,.72);color:#fff;display:grid;place-items:center}
.imgx:hover{background:var(--danger)}
.imgx svg,.iconx svg,.addrow svg{width:14px;height:14px}
.qa-ed{background:var(--soft);border-radius:8px;padding:8px;display:grid;gap:6px;scroll-margin:72px}
.qa-ed-h{display:flex;justify-content:space-between;align-items:center;padding:0 0 0 4px;font-size:12px;font-weight:700;color:var(--muted)}
.qa-ed input[type=text],.qa-ed textarea{background:var(--panel)}
.iconx{width:24px;height:24px;border:0;background:none;border-radius:6px;color:var(--muted);display:grid;place-items:center}
.iconx:hover{background:var(--panel);color:var(--danger)}
.addrow{display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border:1px dashed var(--line);border-radius:6px;background:none;color:var(--muted);font-size:13px;font-weight:500}
.addrow:hover{border-color:var(--accent);color:var(--accent)}
.flash{background:var(--accent-soft);box-shadow:0 0 0 6px var(--accent-soft)}
.insp-empty{display:grid;justify-items:center;gap:12px;padding:88px 24px;color:var(--muted);text-align:center;font-size:13px;line-height:1.6}
.insp-empty svg{width:28px;height:28px;opacity:.55}
.insp-empty p{margin:0}

/* 내보내기 창 · 알림 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.scrim.on{display:flex}
.modal{background:var(--panel);border-radius:10px;width:min(400px,100%);padding:20px;display:grid;gap:16px}
.modal-h{display:grid;gap:4px}
.modal h2{margin:0;font-size:15px;font-weight:700}
.modal p{margin:0;font-size:13px;color:var(--muted)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:14px;display:grid;gap:2px;text-align:left}
.choice:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.choice b{font-size:15px;font-weight:700}
.choice span{font-size:12px;color:var(--muted)}
.snack{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#191f28;color:#fff;border-radius:8px;padding:10px 14px;font-size:13px;display:none;gap:16px;align-items:center;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.snack.on{display:flex}
.snack button{border:0;background:none;color:#8db8ff;font-size:13px;font-weight:700;padding:0}

@media (max-width:900px){
  .top{padding:0 8px 0 12px;gap:8px}
  .status,.sep,.top h1,#btn-open,#btn-theme{display:none}
  .panes{display:block}
  .main{grid-template-columns:minmax(0,1fr)}
  .main>*{display:none}
  body[data-pane="list"] .left{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);border:0}
  body[data-pane="stage"] .stage,body[data-pane="insp"] .insp{display:block}
  .insp{border:0}
  .rail{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:6px 12px}
  .rail button{flex:1;grid-auto-flow:column;justify-content:center;align-items:center;gap:6px;font-size:13px;padding:8px 0}
  .rail button svg{width:18px;height:18px}
  .stage{padding:16px 0 72px}
  .scrim{align-items:flex-end;padding:0}
  .modal{border-radius:10px 10px 0 0;width:100%;padding-bottom:28px}
}
@media (prefers-reduced-motion:no-preference){.btn,.seg button,.rail button,.card,.card::after,.choice,.row,.tools button{transition:background .12s,box-shadow .12s,opacity .12s,color .12s}}

/* ─────────── 상세페이지 본문 (860px 기준, 테마 토큰으로만 색·서체 지정) ─────────── */
.page{
  --p-accent:#1f9f48; --p-bg:#f0f2f5; --p-ink:#1a1a1a; --p-dark:#0d0d0d; --p-on-dark:#ffffff; --p-mute:#c9ced6;
  --p-body:"Pretendard","Malgun Gothic",sans-serif;
  --p-display:"Nanum Brush Script","Pretendard",cursive; --p-display-w:400;
  --p-hand:"Nanum Pen Script","Pretendard",cursive;
  --p-latin:"Caveat","Nanum Pen Script",cursive;
  width:860px;background:#fff;color:var(--p-ink);font-family:var(--p-body);line-height:1.5;word-break:keep-all;text-align:left;
}
.page b,.page strong{font-weight:700}
.page .ac{color:var(--p-accent)}
.blk{position:relative}
#page .blk.sel::after{content:"";position:absolute;inset:0;border:6px solid #2f7bf6;pointer-events:none}
#page .blk{cursor:pointer}
#page .blk:not(.sel):hover::after{content:"";position:absolute;inset:0;border:6px solid rgba(47,123,246,.35);pointer-events:none}
#page [data-edit]{border-radius:8px}
#page [data-edit]:hover,#page .ph:hover{box-shadow:0 0 0 5px rgba(47,123,246,.5)}
.ph{background-color:#e4e8ee;background-size:cover;background-position:center}
.ph.none{display:grid;place-items:center;text-align:center;color:#8b95a1;font-size:30px;font-weight:600;line-height:1.5;outline:3px dashed rgba(0,0,0,.14);outline-offset:-28px}
.ph.none small{font-size:22px;font-weight:400}

.b-hook{position:relative;background:var(--p-dark);color:var(--p-on-dark);text-align:center;padding-top:120px;min-height:1500px;display:flex;flex-direction:column;align-items:center}
.b-hook>.logo,.b-hook>.eyebrow,.b-hook>.title{position:relative;z-index:1}
.b-hook .logo{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:.02em}
.b-hook .eyebrow{margin-top:104px;font-size:28px;font-weight:500;line-height:1.3;max-width:760px}
.b-hook .title{margin-top:40px;width:760px;font-family:var(--p-display);font-weight:var(--p-display-w);line-height:1.04;white-space:nowrap}
.b-hook.v-dark .ph{position:absolute;inset:0}
.b-hook.v-dark .ph.none{background-color:var(--p-dark);align-items:end;padding-bottom:220px;color:rgba(255,255,255,.6);outline-color:rgba(255,255,255,.22)}
.b-hook.v-light{background:var(--p-bg);color:var(--p-ink);padding-bottom:80px;min-height:0}
.b-hook.v-light .eyebrow{color:var(--p-accent);font-weight:700}
.b-hook.v-light .ph{width:760px;height:700px;border-radius:36px;margin-top:80px}

.plabel{position:relative;font-family:var(--p-latin);font-weight:700;font-size:54px;line-height:1;color:var(--p-accent);padding:0 16px 20px}
.plabel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;border-top:4px solid var(--p-accent);border-radius:50%;pointer-events:none}
.b-point{background:var(--p-bg);text-align:center;padding:200px 0 60px;display:flex;flex-direction:column;align-items:center}
.b-point .hl{margin-top:40px;max-width:720px;font-size:46px;font-weight:300;line-height:1.38}
.b-point .hl2{max-width:720px;font-size:46px;font-weight:700;line-height:1.38}

.b-photo .ph{width:860px;height:700px}
.b-photo.v-tall .ph{height:1075px}

.b-emph{background:var(--p-bg);text-align:center;padding:150px 0;display:flex;flex-direction:column;align-items:center}
.b-emph .hand{font-family:var(--p-hand);font-size:96px;line-height:1.15}
.b-emph .big{margin-top:48px;width:760px;white-space:nowrap;font-size:196px;font-weight:900;line-height:1.1;color:var(--p-accent)}
.b-emph .desc{margin-top:56px;width:680px;font-size:32px;font-weight:300;line-height:1.55}

.b-text{background:#fff;text-align:center;padding:140px 0;display:flex;flex-direction:column;align-items:center}
.b-text .t{max-width:720px;font-size:52px;font-weight:700;line-height:1.35}
.b-text .d{margin-top:36px;max-width:680px;font-size:30px;font-weight:300;line-height:1.6}

.b-marks{background:var(--p-dark);color:var(--p-on-dark);text-align:center;padding:120px 0}
.b-marks .ms{display:flex;justify-content:center;gap:36px}
.b-marks .m{width:210px;height:210px;border-radius:50%;border:4px solid var(--p-accent);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;line-height:1.3}
.b-marks .line{margin:64px auto 0;max-width:720px;font-size:34px;font-weight:500;line-height:1.45}

.b-circle{background:#fff;text-align:center;padding:140px 0;display:flex;flex-direction:column;align-items:center}
.b-circle .ph{width:420px;height:420px;border-radius:50%}
.b-circle .t{margin-top:56px;max-width:720px;font-size:46px;font-weight:700;line-height:1.35}
.b-circle ul{list-style:none;margin:40px 0 0;padding:0;width:640px;text-align:left}
.b-circle li{display:grid;grid-template-columns:44px 1fr;gap:20px;align-items:start;padding:28px 0;border-top:2px solid var(--p-bg);font-size:30px;line-height:1.45}
.b-circle li:first-child{border-top:0}
.b-circle li i{position:relative;width:44px;height:44px;border-radius:50%;background:var(--p-accent)}

/* ───────── 글자 처리: 글자는 그대로 저장, 강조는 "강조할 단어" 목록으로 ───────── */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function validDoc(d){

    if(b&&b.type==='number'&&b.data) return out.concat(splitNumber(b));
    out.push(b);return out;
  },[]);
  d.blocks=d.blocks.filter(function(b){return b&&BLOCKS[b.type]&&b.data;});
  d.blocks.forEach(function(b){
    var s=BLOCKS[b.type];
    rekey(b,KEYMAP[b.type]||{});
    if(!s.variants.some(function(v){return v.id===b.variant;})) b.variant=s.variants[0].id;
    var def=s.defaults(b.variant);
    if(old) s.fields.forEach(function(f){if(f.type==='image'&&!b.data[f.key]) b.data[f.key]=def[f.key];});
    if(!b.id) b.id=uid();

    s.fields.forEach(function(f){

  });

  if(selId===id&&tab==='block') return;

  [].forEach.call($('page').querySelectorAll('.blk'),function(n){n.classList.toggle('sel',n.getAttribute('data-id')===id);});
  renderLeft();renderInsp();placeTools();
}

/* ───────── 되돌리기 · 자동 저장 ───────── */
function snap(){return JSON.stringify({theme:doc.theme,display:doc.display,blocks:doc.blocks});}
var hist=[snap()], hi=0, recT=null, dbp=null, saveT=null;
function histBtns(){$('btn-undo').disabled=hi<=0&&!recT;$('btn-redo').disabled=hi>=hist.length-1;}
function record(){
  clearTimeout(recT);recT=null;
  var s=snap();
  if(s!==hist[hi]){hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>80) hist.shift();hi=hist.length-1;}
  histBtns();
}
function restore(s){
  var o=JSON.parse(s);doc.theme=o.theme;doc.display=o.display;doc.blocks=o.blocks;
  if(!byId(selId)) selId=(doc.blocks[0]||{}).id||null;
  renderAll();histBtns();save();
}
function undo(){if(recT) record();if(hi>0){hi--;restore(hist[hi]);}}
function redo(){if(recT) record();if(hi<hist.length-1){hi++;restore(hist[hi]);}}
function resetHist(){clearTimeout(recT);recT=null;hist=[snap()];hi=0;histBtns();}
function serializeDoc(){
  var used={};
  doc.blocks.forEach(function(b){BLOCKS[b.type].fields.forEach(function(f){if(f.type==='image'&&b.data[f.key]) used[b.data[f.key]]=1;});});
  var assets={};Object.keys(doc.assets).forEach(function(k){if(used[k]) assets[k]=doc.assets[k];});
  return JSON.stringify({version:4,theme:doc.theme,display:doc.display,assets:assets,blocks:doc.blocks});
}
function db(){
  if(!dbp) dbp=new Promise(function(res,rej){
    try{var r=indexedDB.open('detail-page-block-editor',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('kv');};
      r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};
    }catch(e){rej(e);}
  });
  return dbp;
}
function dbGet(k){return db().then(function(d){return new Promise(function(res,rej){var q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});});}
function dbPut(k,v){return db().then(function(d){return new Promise(function(res,rej){var tx=d.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=function(){rej(tx.error);};});});}
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    dbPut('doc',serializeDoc()).then(function(){
      var d=new Date();$('status').textContent='자동 저장됨 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    }).catch(function(){ $('status').textContent='자동 저장을 쓸 수 없어요. 작업 파일로 저장해 주세요'; });
  },500);
}
/* 바뀐 뒤 부르기: typing=true면 잠깐 모아서 한 번에 기록 */
function touch(typing){
  if(typing){clearTimeout(recT);recT=setTimeout(record,450);histBtns();}else record();
  save();
}

/* ───────── 알림 ───────── */
var snackT=null;
function snack(msg,actLabel,act){
  $('snack-t').textContent=msg;
  var a=$('snack-a');
  if(actLabel){a.hidden=false;a.textContent=actLabel;a.onclick=function(){$('snack').classList.remove('on');act();};}else{a.hidden=true;a.onclick=null;}
  $('snack').classList.add('on');clearTimeout(snackT);
  snackT=setTimeout(function(){$('snack').classList.remove('on');},actLabel?6000:3200);
}

/* ───────── 가운데 미리보기: 선택만. 누른 부분의 수정 칸으로 오른쪽 패널이 이동 ───────── */
function focusField(path){
  var m=/^items\.(\d+)\.(q|a)$/.exec(path), wrap, inp;
  if(m){wrap=$('w-qa-'+m[1]);inp=$('f-'+m[2]+'-'+m[1]);}
  else{wrap=$('w-'+path);inp=$('f-'+path);}
  if(!wrap) return;
  wrap.scrollIntoView({block:'center'});
  if(inp&&inp.type!=='file'){try{inp.focus({preventScroll:true});}catch(e){}}
  wrap.classList.add('flash');setTimeout(function(){wrap.classList.remove('flash');},1400);
}
$('page').addEventListener('click',function(e){
  var n=e.target.closest('.blk'); if(!n) return;
  var part=e.target.closest('[data-edit],[data-slot]');
  selectLight(n.getAttribute('data-id'));
  if(narrow()) setPane('insp');
  if(part) focusField(part.getAttribute('data-edit')||part.getAttribute('data-slot'));
});

/* ───────── 파일 저장·내보내기 ───────── */
function saveFile(filename,data,mime){
  var c=window.claude, p=(c&&typeof c.use==='function')?c.use('downloads'):Promise.resolve(null);
  return p.catch(function(){return null;}).then(function(dl){
    if(dl){
      return dl.save({filename:filename,data:data}).then(function(){snack(filename+' 저장했어요');})
        .catch(function(e){snack(e&&e.code==='declined'?'저장을 취소했어요':'저장하지 못했어요. 잠시 뒤 다시 시도해 주세요');});
    }
    try{
      var blob=data instanceof Blob?data:new Blob([data],{type:mime});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
      snack(filename+' 내려받기를 시작했어요');
    }catch(e){snack('이 화면에서는 파일 저장을 쓸 수 없어요');}
  });
}
function saveWork(){return saveFile('상세페이지_작업파일.json',serializeDoc(),'application/json');}
function exportImage(kind){
  if(!doc.blocks.length){snack('내보낼 블록이 없어요');return;}
  if(typeof html2canvas!=='function'){snack('내보내기 도구를 불러오지 못했어요. 새로고침해 주세요');return;}
  snack('이미지를 만들고 있어요');
  var off=$('off');off.innerHTML='<div class="page"></div>';
  var p=off.firstChild;applyTheme(p);p.innerHTML=pageHTML(false);fit(p);
  var ready=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  ready.then(function(){fit(p);return html2canvas(p,{scale:1,backgroundColor:'#ffffff',logging:false,width:860,windowWidth:1200});})
    .then(function(cv){return new Promise(function(res){cv.toBlob(res,kind==='jpg'?'image/jpeg':'image/png',0.92);});})
    .then(function(blob){off.innerHTML='';if(!blob) throw new Error('blob');return saveFile('상세페이지_860.'+kind,blob,blob.type);})
    .catch(function(){off.innerHTML='';snack('이미지를 만들지 못했어요. 블록 수를 줄여 다시 시도해 주세요');});
}
function readImage(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=rej;
    fr.onload=function(){
      var img=new Image();
      img.onerror=rej;
      img.onload=function(){
        var max=1720, w=img.naturalWidth, h=img.naturalHeight, k=w>max?max/w:1;
        var cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(/png$/i.test(file.type)?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',0.88));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ───────── 왼쪽: 구성 목록 · 블록 추가 ───────── */
function addBlock(type,variant){
  var nb=makeBlock(type,variant), i=doc.blocks.findIndex(function(b){return b.id===selId;});
  doc.blocks.splice(i<0?doc.blocks.length:i+1,0,nb);
  selId=nb.id;tab='block';renderAll();touch();
  var n=$('page').querySelector('[data-id="'+nb.id+'"]'); if(n){n.scrollIntoView({block:'nearest'});placeTools();}
  if(narrow()) setPane('stage');
  snack(BLOCKS[type].name+' 블록을 추가했어요','되돌리기',undo);
}
function blockAct(act,id){
  var i=doc.blocks.findIndex(function(b){return b.id===id;}); if(i<0) return;
  if(act==='up'&&i>0){doc.blocks.splice(i-1,0,doc.blocks.splice(i,1)[0]);}
  else if(act==='down'&&i<doc.blocks.length-1){doc.blocks.splice(i+1,0,doc.blocks.splice(i,1)[0]);}
  else if(act==='dup'){var cp=JSON.parse(JSON.stringify(doc.blocks[i]));cp.id=uid();doc.blocks.splice(i+1,0,cp);selId=cp.id;}
  else if(act==='del'){
    doc.blocks.splice(i,1);
    if(selId===id) selId=(doc.blocks[i]||doc.blocks[i-1]||{}).id||null;
    renderAll();touch();snack('블록을 삭제했어요','되돌리기',undo);return;
  }else return;
  renderAll();touch();
  var n=$('page').querySelector('.blk.sel'); if(n){n.scrollIntoView({block:'nearest'});placeTools();}
}
$('tools').addEventListener('click',function(e){
  var t=e.target.closest('[data-tool]'); if(t&&selId) blockAct(t.getAttribute('data-tool'),selId);
});
$('rail').addEventListener('click',function(e){
  var t=e.target.closest('[data-left]'); if(!t) return;
  leftTab=t.getAttribute('data-left');renderLeft();
});
$('left-body').addEventListener('keydown',function(e){
  var c=e.target.closest('.card'); if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();addBlock(c.getAttribute('data-add'),c.getAttribute('data-v'));}
});
$('left-body').addEventListener('click',function(e){
  var c=e.target.closest('.card'); if(c){addBlock(c.getAttribute('data-add'),c.getAttribute('data-v'));return;}
  var btn=e.target.closest('[data-act="pick"]'); if(!btn) return;
  selId=btn.closest('.row').getAttribute('data-id');tab='block';renderAll();
  var n=$('page').querySelector('.blk.sel'); if(n){n.scrollIntoView({block:'nearest'});placeTools();}
});
/* 끌어서 순서 바꾸기 */
var drag=null;
function clearDrop(){[].forEach.call($('left-body').querySelectorAll('.drop-before,.drop-after'),function(r){r.classList.remove('drop-before','drop-after');});}
$('left-body').addEventListener('pointerdown',function(e){
  var h=e.target.closest('[data-drag]'); if(!h) return;
  e.preventDefault();
  var row=h.closest('.row');drag={id:row.getAttribute('data-id'),target:null,pos:null};
  try{h.setPointerCapture(e.pointerId);}catch(x){}
  row.classList.add('drag');
});
$('left-body').addEventListener('pointermove',function(e){
  if(!drag) return;
  clearDrop();drag.target=null;
  var el=document.elementFromPoint(e.clientX,e.clientY), row=el&&el.closest&&el.closest('#rows .row');
  if(!row||row.getAttribute('data-id')===drag.id) return;
  var r=row.getBoundingClientRect();
  drag.target=row.getAttribute('data-id');drag.pos=e.clientY<r.top+r.height/2?'before':'after';
  row.classList.add(drag.pos==='before'?'drop-before':'drop-after');
});
function endDrag(){
  if(!drag) return;
  var d=drag;drag=null;clearDrop();
  if(d.target){
    var i=doc.blocks.findIndex(function(b){return b.id===d.id;}), blk=doc.blocks.splice(i,1)[0];
    var j=doc.blocks.findIndex(function(b){return b.id===d.target;});
    doc.blocks.splice(d.pos==='before'?j:j+1,0,blk);
    selId=d.id;renderAll();touch();
  }else renderLeft();
}
$('left-body').addEventListener('pointerup',endDrag);
$('left-body').addEventListener('pointercancel',function(){drag=null;renderLeft();});

/* ───────── 오른쪽 수정 패널 ───────── */
$('insp-body').addEventListener('input',function(e){
  var t=e.target, b=sel(); if(!b) return;
  var s=BLOCKS[b.type];
  if(t.hasAttribute('data-key')){
    var k=t.getAttribute('data-key'), f=s.fields.filter(function(x){return x.key===k;})[0];
    b.data[k]=t.value;
    syncMeta(f,t.value);
  }else if(t.hasAttribute('data-em')){
    if(!b.data.em) b.data.em={};
    b.data.em[t.getAttribute('data-em')]=t.value;
  }else if(t.hasAttribute('data-qa')){
    var i=+t.getAttribute('data-qa'), f2=s.fields.filter(function(x){return x.type==='qa';})[0];
    b.data.items[i][t.getAttribute('data-part')]=t.value;
    var h2=$('h-qa-'+i); if(h2) h2.hidden=plainLen(b.data.items[i].a)<=f2.maxA;
  }else return;
  renderPage();renderLeft();touch(true);
});
$('insp-body').addEventListener('change',function(e){
  var t=e.target, b=sel();
  if(!b||!t.hasAttribute('data-img')||!t.files||!t.files[0]) return;
  var key=t.getAttribute('data-img');
  readImage(t.files[0]).then(function(url){
    var id='a'+uid();doc.assets[id]=url;b.data[key]=id;renderAll();touch();snack('사진을 넣었어요');
  }).catch(function(){snack('사진을 읽지 못했어요. JPG나 PNG 파일인지 확인해 주세요');});
});
$('insp-body').addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;
  var b=sel();
  if(!b) return;
  if(t.hasAttribute('data-imgdel')){b.data[t.getAttribute('data-imgdel')]='';renderAll();touch();}
  else if(t.hasAttribute('data-qadel')){b.data.items.splice(+t.getAttribute('data-qadel'),1);renderAll();touch();}
  else if(t.hasAttribute('data-qaadd')){var qf=qaField(BLOCKS[b.type]);b.data.items.push({q:(qf.q||'질문')+'을 적어 주세요',a:(qf.a||'답변')+'을 적어 주세요'});renderAll();touch();}
});

/* ───────── 상단 ───────── */
$('btn-undo').addEventListener('click',undo);
$('btn-redo').addEventListener('click',redo);
$('btn-save').addEventListener('click',saveWork);
function openExport(){
  if(!doc.blocks.length){snack('먼저 블록을 추가해 주세요');return;}
  exportOpen=true;$('scrim').classList.add('on');$('scrim').querySelector('.choice').focus();
}
function closeExport(){exportOpen=false;$('scrim').classList.remove('on');}
$('btn-export').addEventListener('click',openExport);
$('ex-x').addEventListener('click',closeExport);
$('scrim').addEventListener('click',function(e){
  if(e.target===$('scrim')){closeExport();return;}
  var c=e.target.closest('[data-export]'); if(c){closeExport();exportImage(c.getAttribute('data-export'));}
});
$('btn-open').addEventListener('click',function(){$('file-open').click();});
$('file-open').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    var d=null;try{d=validDoc(JSON.parse(fr.result));}catch(err){}
    if(!d){snack('이 편집기에서 저장한 작업 파일(.json)이 아니에요');return;}
    Object.keys(urlCache).forEach(function(k){try{URL.revokeObjectURL(urlCache[k]);}catch(x){}});urlCache={};
    doc=d;selId=(doc.blocks[0]||{}).id||null;renderAll();resetHist();save();snack('작업 파일을 불러왔어요');
  };
  fr.readAsText(f);e.target.value='';
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&exportOpen){closeExport();return;}
  if(!(e.ctrlKey||e.metaKey)) return;
  var k=e.key.toLowerCase();
  if(k==='s'){e.preventDefault();saveWork();}
  else if(k==='z'){e.preventDefault();if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();if(e.shiftKey) redo(); else undo();}
  else if(k==='y'){e.preventDefault();if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();redo();}
});
$('pane-seg').addEventListener('click',function(e){
  var t=e.target.closest('[data-pane]'); if(t) setPane(t.getAttribute('data-pane'));
});

/* 미리보기 배율: 가운데 영역 폭에 맞춤 */
function rescale(){
  var sw=$('stage').clientWidth; if(sw<=0) return;
  var side=narrow()?16:Math.max(64,sw*0.22);
  $('page').style.zoom=Math.max(0.2,Math.min(0.62,(sw-side*2)/860)).toFixed(3);
  placeTools();
}
if(window.ResizeObserver) new ResizeObserver(rescale).observe($('stage')); else window.addEventListener('resize',rescale);
$('stage').addEventListener('scroll',placeTools,{passive:true});

/* 밝게 / 어둡게 */
function isDark(){var a=document.documentElement.getAttribute('data-theme');return a?a==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;}
$('btn-theme').addEventListener('click',function(){
  var next=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('dp-editor-theme',next);}catch(e){}
});
try{var savedTheme=localStorage.getItem('dp-editor-theme');if(savedTheme==='dark'||savedTheme==='light') document.documentElement.setAttribute('data-theme',savedTheme);}catch(e){}
[].forEach.call(document.querySelectorAll('[data-ic]'),function(e){e.innerHTML=ic(e.getAttribute('data-ic'));});

/* ───────── 시작 ───────── */
renderAll();rescale();histBtns();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){fit($('page'));if(leftTab==='add') renderLeft();});
dbGet('doc').then(function(raw){
  var d=null;try{d=raw?validDoc(JSON.parse(raw)):null;}catch(e){}
  if(d){doc=d;selId=(doc.blocks[0]||{}).id||null;renderAll();resetHist();$('status').textContent='이전 작업을 이어서 열었어요';}
  else $('status').textContent='예시 문서로 시작했어요';
}).catch(function(){$('status').textContent='예시 문서로 시작했어요';});

})();
</script>
